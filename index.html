<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Feedbacks | Tatiana Sofia Gomes Lima</title>
  <meta name="description" content="Feedback viewer for Tatiana Sofia Gomes Lima's portfolio. Featuring testimonials from former colleagues and employers." />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .glass {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }
    .reflect {
      -webkit-box-reflect: below 0px linear-gradient(transparent, rgba(0,0,0,0.1));
    }
  </style>
</head>
<body class="bg-gradient-to-br from-purple-400 via-pink-300 to-yellow-200 min-h-screen flex flex-col items-center justify-center text-white font-sans px-4 py-10">

  <!-- Title -->
  <h1 class="text-4xl font-bold mb-2 drop-shadow-xl text-center">Feedback Viewer</h1>

  <!-- Description -->
  <p class="text-white/80 text-center max-w-xl mb-6 text-lg">
    A collection of kind words and feedback I’ve received from former colleagues and employers — showcasing the impact I’ve made in different teams and environments.
  </p>

  <!-- Viewer Container -->
  <div class="glass rounded-2xl shadow-2xl p-6 max-w-5xl w-full flex flex-col items-center space-y-6">

    <!-- Iframe -->
    <div class="w-full h-[70vh] rounded-xl overflow-hidden shadow-xl border-2 border-white">
      <iframe id="pdf-frame" class="w-full h-full" src="" allowfullscreen></iframe>
    </div>

    <!-- Navigation -->
    <div class="flex gap-4 items-center justify-center">
      <button onclick="prevPdf()" class="bg-white text-purple-600 font-semibold px-5 py-2 rounded-full hover:bg-purple-600 hover:text-white transition shadow-md disabled:opacity-50 previous">Previous</button>
      <span class="text-lg font-medium numberOfpdf">PDF number</span>
      <button onclick="nextPdf()" class="bg-white text-purple-600 font-semibold px-5 py-2 rounded-full hover:bg-purple-600 hover:text-white transition shadow-md disabled:opacity-50 next">Next</button>
    </div>
  </div>

  <!-- Script -->
  <script>
    const pdfUrls = [
      "https://drive.google.com/file/d/10_gzwZ0zJ_FUaIqaqOAL51lf3x_obMbK/preview",
      "https://drive.google.com/file/d/1Grnsx1mlW2wTanuP1THEW-_vCKMfGq0w/preview",
      "https://drive.google.com/file/d/1_mAuBO1PyIylRE5BWeq6_tEKHV5PAdR4/preview"
    ];
    let currentIndex = 0;
    const nextButton = document.querySelector('.next');
    const prevButton = document.querySelector('.previous');

    function updatePdf() {
      const iframe = document.getElementById('pdf-frame');
      iframe.src = pdfUrls[currentIndex];
      numberOfpdf();
      updateButtons();
    }

    function nextPdf() {
      if (currentIndex < pdfUrls.length - 1) {
        currentIndex++;
        updatePdf();
      }
    }

    function prevPdf() {
      if (currentIndex > 0) {
        currentIndex--;
        updatePdf();
      }
    }

    function numberOfpdf() {
      const numberOfpdf = document.querySelector('.numberOfpdf');
      const pdfUrlsLength = pdfUrls.length;
      numberOfpdf.innerHTML = `PDF ${currentIndex + 1} of ${pdfUrlsLength}`;
    }

    function updateButtons() {
      prevButton.disabled = currentIndex === 0;
      nextButton.disabled = currentIndex === pdfUrls.length - 1;
    }

    document.addEventListener('DOMContentLoaded', function () {
      updatePdf();
    });

    window.nextPdf = nextPdf;
    window.prevPdf = prevPdf;
  </script>

</body>
</html>
